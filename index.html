<script>
const KEY='yanan_museum_v4';const names=['选择主题','探索知识','表达观点','编排故事','视觉共创','空间生成','体验分享'];const tasks=[
{q:'你想讲述哪段历史？',mission:'围绕延安自然科学院，确定你感兴趣的视角。不限制表达方式。',goal:'个人策展主题',opening:'欢迎来到思政博物馆创作工作台。\n你想从延安自然科学院的哪段故事出发？可以讲学校的发展、马兰草造纸，也可以提出自己的视角。',quick:['从延安自然科学院出发','从一株马兰草到一本书','我想讲学院发展历史']},
{q:'哪些知识值得成为展品？',mission:'完成15分钟学习，根据兴趣收藏人物、物件、照片或历史场景。',goal:'一份个人展品素材包',opening:'这一步我们探索知识。原剧本包含延安来信、北湖、教室、马兰草、实验室、显微镜、书本等素材。\n告诉我你感兴趣的内容，也可以直接在右侧收藏。',quick:['收藏延安来信和学院照片','我想要马兰草和显微镜','给我更多历史素材建议']},
{q:'你想让观众记住什么？',mission:'自由形成策展主张，可以自己写，也可以从选过的素材得到启发。',goal:'一段经过确认的个人表达',opening:'你希望观众走出展馆时，记住哪种思考？\n先用自己的话表达，不必写专业文案。',quick:['科学如何解决现实问题','我想突出教育传承','帮我整理我的观点']},
{q:'这个故事应该怎样展开？',mission:'从素材中安排故事节点，选择顺序、起点和重点。',goal:'可修改的展览故事板',opening:'把你的想法变成一条故事线。\n可以从一件展品开头，也可以倒叙、按时间讲述，或者从一个问题开始。',quick:['从一封信进入历史','从一本书倒叙到造纸实验','帮我建议故事结构']},
{q:'你想让展馆呈现什么画面？',mission:'根据已有展品与故事，构思关键展品图和历史场景参考图。生成或使用已有素材都可以。',goal:'用于展馆的视觉素材与概念图',opening:'现在为故事创造视觉内容。\n你想先生成哪张图？可以是一件历史物件、一个展厅场景，或者整座馆的氛围草图。\n确认视觉方向后，这些图将被带到空间生成阶段。',quick:['生成延安窑洞教室的场景图','生成马兰草造纸工坊的概念图','生成显微镜展品参考图']},
{q:'观众该如何走进你的故事？',mission:'描述参观路线、空间氛围或互动构想；AI 根据故事和已选图片汇总概念空间。',goal:'展厅布局与概念空间预览',opening:'有了故事和视觉素材，现在设计空间。\n可以简单说“先进入延安教室，再来到实验室，最后看到一本书”。你也可以只说最想强调的体验。',quick:['历史教室到造纸作坊的动线','用刚才的图片设计展厅','让显微镜成为互动中心']},
{q:'作品呈现了你的想法吗？',mission:'审阅整座博物馆的主题、展品、视觉和空间，继续修改并输出。',goal:'个人博物馆方案和作品反思',opening:'这里汇总当前已创建的策展内容。未完成的部分会保持空白。\n检查右侧总览，看看展品和画面是否支持你原本的观点。需要修改任何部分，都可以返回对应阶段。',quick:['帮我检查是否完整','我想修改视觉风格','帮我总结这座展馆']}
];
const materials=['延安来信','北湖','学院历史照片','教室黑板','马兰草','造纸工坊','坩埚','显微镜','抄纸工具','晒纸车间','书本','马兰花'];const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let s={stage:0,topic:'',claim:'',nodes:[],images:[],space:'',concept:false,chats:{}};try{let old=JSON.parse(localStorage.getItem(KEY));if(old)s={...s,...old}}catch(e){};function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function toast(v){$('toast').textContent=v;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}function setval(k,v){s[k]=v;save();renderPreview()}function ask(label,old,cb){let v=prompt(label,old||'');if(v!==null){cb(v.trim());toast('作品预览已同步更新')}}function imageSVG(type){let t=String(type||'');let scene=/场景|教室|工坊|展厅|北湖|空间|走廊/.test(t);if(scene)return `<svg viewBox="0 0 180 104" aria-label="黑白场景线稿"><g stroke="#222" stroke-width="1.5" fill="none"><path d="M0 91 L55 60 L125 60 L180 91 M55 60V17H125V60 M55 17L90 4L125 17 M62 53V27H81V53M98 53V27H117V53M75 91V68H105V91 M0 91H180 M20 76V45M20 45H43V67M137 67V45H160V76"/><path d="M10 90V62L24 55L38 62V90 M145 90V62L159 55L173 62V90"/><path d="M86 24H94V38H86z"/></g></svg>`;if(/信|照片|书本|档案|纸/.test(t))return `<svg viewBox="0 0 180 104"><g stroke="#222" stroke-width="1.5" fill="none"><rect x="52" y="13" width="76" height="79" rx="2"/><path d="M65 29H115M65 37H109M65 45H116M65 60H108M65 68H116M65 76H94"/><path d="M122 18V28H112"/></g></svg>`;if(/马兰草/.test(t))return `<svg viewBox="0 0 180 104"><g stroke="#222" stroke-width="1.5" fill="none"><path d="M90 93V15 M90 75Q51 59 41 28Q79 33 90 75 M90 67Q120 40 140 20Q137 55 90 67 M90 89Q65 74 60 56M90 55Q74 30 80 11M90 93H56M90 93H123"/></g></svg>`;return `<svg viewBox="0 0 180 104"><g stroke="#222" stroke-width="1.5" fill="none"><ellipse cx="90" cy="76" rx="48" ry="11"/><path d="M51 74V86M129 74V86M42 86H138M76 68V39L90 17L104 39V68M79 37H101M78 52H102M90 18V8M70 71H110"/><circle cx="90" cy="45" r="8"/></g></svg>`}
function proposal(text){let v=text.trim();if(!v)return null;let quoted=v.match(/[“「"](.+?)[”」"]/);let val=quoted?.[1]||v;let mat=materials.filter(x=>v.includes(x));switch(s.stage){case 0:return{kind:'topic',value:val.slice(0,90),label:'作为我的主题'};case 1:return{kind:'nodes',value:mat.length?mat:[val.slice(0,30)],label:'添加到素材库'};case 2:return{kind:'claim',value:val.slice(0,200),label:'保存我的观点'};case 3:return{kind:'nodes',value:mat.length?mat:[val.slice(0,35)],label:'加入故事节点'};case 4:return{kind:'image',value:val.replace(/^生成|^帮我生成|^我想生成/,'').trim().slice(0,100)||val.slice(0,100),label:'生成概念图片草稿'};case 5:return{kind:'space',value:val.slice(0,230),label:'保存空间方案'};default:return null}}
function add(role,text,p){let a=s.chats[s.stage]||(s.chats[s.stage]=[]);a.push({role,text,p});save();renderChat()}function apply(p){if(!p)return;if(p.kind==='nodes'){p.value.forEach(n=>{if(!s.nodes.includes(n))s.nodes.push(n)})}else if(p.kind==='image'){s.images.push({id:Date.now()+Math.random(),title:p.value,selected:true});s.concept=false}else{s[p.kind]=p.value;if(p.kind==='space')s.concept=true}save();renderPreview();toast(p.kind==='image'?'概念线稿已生成并加入视觉板':'已加入作品，右侧预览已更新')}
function reply(v){let p=proposal(v);if(s.stage===4)return{p,text:'我先把你的描述转换成一张黑白概念线稿卡。你可以选择保留或删除，它会进入下一阶段的空间概念预览。\n\n这是本地流程模拟，接入真实图像模型后会生成真实图片。'};let texts=['这是一个可行的个人叙事角度。你可以保留原文，也能继续调整标题。','我从你的描述里提取了候选素材，确认后它们会出现在右侧预览。','这是你自己的观点草稿，我不会替你决定它的立场。','我整理出这些故事节点。你可以在右侧调整顺序，形成自己的路线。','','我将你的空间设想保留为方案，并结合已选视觉参考更新右侧概念展厅。','你可以查看右侧的成果总览，也能回到之前任何阶段修改。'];return{p,text:texts[s.stage]}}
function send(){let v=$('input').value.trim();if(!v)return;add('user',v);$('input').value='';let r=reply(v);add('ai',r.text,r.p)}function renderChat(){let a=s.chats[s.stage];if(!a?.length){s.chats[s.stage]=[{role:'ai',text:tasks[s.stage].opening}];a=s.chats[s.stage];save()}$('chatlog').innerHTML=a.map((x,i)=>`<div class="bubble ${x.role}">${x.role==='ai'?`<div class="speaker">✧ AI 策展伙伴</div>`:''}${escapeHTML(x.text)}${x.p?`<div class="draft"><small>${x.p.kind==='image'?'待生成视觉草稿':'待确认的创作内容'}</small><div>${escapeHTML(Array.isArray(x.p.value)?x.p.value.join('、'):x.p.value)}</div><div class="buttons"><button class="primary" data-apply="${i}">${escapeHTML(x.p.label)}</button><button data-revise="${i}">修改后再用</button></div></div>`:''}</div>`).join('');$('chatlog').querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>apply(a[+b.dataset.apply].p));$('chatlog').querySelectorAll('[data-revise]').forEach(b=>b.onclick=()=>{$('input').value=Array.isArray(a[+b.dataset.revise].p.value)?a[+b.dataset.revise].p.value.join('、'):a[+b.dataset.revise].p.value;$('input').focus()});$('chatlog').scrollTop=$('chatlog').scrollHeight}
function renderPreview(){let index=s.stage;$('previewName').textContent=['主题概览','知识素材板','策展观点卡','展览故事板','视觉素材板','空间概念预览','作品完整总览'][index];$('summaryTopic').textContent=s.topic||'待创作';$('summaryClaim').textContent=s.claim||'待创作';$('summaryNodes').textContent=s.nodes.length+' 件';$('summaryImages').textContent=s.images.length+' 张';$('summarySpace').textContent=s.space||'待创作';let out='';if(index===0){out=`<div class="panel"><h3>主题草稿</h3><div class="detail">${escapeHTML(s.topic||'还没有确定主题。在中间写下你的想法，确认后这里会出现你的主题。')}</div></div><div class="tools"><button id="editTopic">直接编辑主题</button></div>`}
if(index===1){out=`<div class="panel"><h3>知识素材收藏夹 · ${s.nodes.length} 件</h3><div class="detail">从下面选择，也可以通过中间对话自由添加。</div><div class="tools">${materials.map((n,i)=>`<button data-material="${i}">${s.nodes.includes(n)?'✓ ':'＋ '}${escapeHTML(n)}</button>`).join('')}</div></div>${nodeList(false)}`}
if(index===2){out=`<div class="panel"><h3>我的策展主张</h3><div style="font-size:16px;padding:13px 0">${escapeHTML(s.claim||'还没有形成观点。可以直接向 AI 说出你的理解。')}</div><button id="editClaim">直接编辑观点</button></div><div class="panel"><h3>从素材到观点</h3><div class="detail">已收集：${escapeHTML(s.nodes.join(' · ')||'暂无素材')}</div></div>`}
if(index===3){out=`<div class="panel"><h3>我的展览故事线</h3><div class="detail">你可以改变顺序、删除或加入新的展品节点。</div>${nodeList(true)}<button id="addNode">＋ 自由添加节点</button></div>`}
if(index===4){out=`<div class="panel"><h3>视觉素材生成与选择</h3><div class="detail">根据故事内容生成单件展品、场景或展馆概念图。这里用黑白线稿模拟生成。</div><div class="visgrid">${s.images.length?s.images.map((im,i)=>visualCard(im,i)).join(''):'<div class="ghostline">还没有图片。在中间描述想生成的画面。</div>'}</div><div class="tools"><button id="newImage">＋ 生成新图片</button></div></div><div class="panel"><h3>可视化内容依据</h3><div class="detail">展品：${escapeHTML(s.nodes.join('、')||'暂无')}。没有图像时也可以进入下一阶段，使用基础空间草图。</div></div>`}
if(index===5){out=`${sceneCard()}<div class="panel"><h3>空间配置</h3><div class="detail">${escapeHTML(s.space||'还没有空间描述，可参考已有展品与视觉素材自由构思。')}</div><div class="tools"><button id="editSpace">编辑空间构想</button><button id="rebuild">更新概念预览</button></div></div><div class="panel"><h3>将用于空间的视觉素材 · ${s.images.filter(v=>v.selected).length} 张</h3><div class="visgrid">${s.images.filter(v=>v.selected).map((im,i)=>`<div class="visualcard"><div class="thumbnail">${imageSVG(im.title)}</div><div class="cap">${escapeHTML(im.title)}</div></div>`).join('')||'<div class="ghostline">未选视觉参考，使用默认线稿空间。</div>'}</div></div>`}
if(index===6){out=`${sceneCard()}<div class="panel"><h3>策展摘要</h3><div class="previewitem"><span>核心表达：</span>${escapeHTML(s.claim||'未填写')}</div><div class="previewitem"><span>空间体验：</span>${escapeHTML(s.space||'未填写')}</div><div class="previewitem"><span>展览故事线：</span>${escapeHTML(s.nodes.join(' → ')||'未填写')}</div><div class="previewitem"><span>视觉素材：</span>${escapeHTML(s.images.filter(v=>v.selected).map(x=>x.title).join('、')||'未选')}</div><div class="tools"><button id="exportInline">导出作品方案</button><button id="review">返回调整空间</button></div></div>`}
$('dynamicPreview').innerHTML=out;document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{let n=materials[+b.dataset.material];s.nodes=s.nodes.includes(n)?s.nodes.filter(x=>x!==n):[...s.nodes,n];save();renderPreview()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{s.nodes.splice(+b.dataset.remove,1);save();renderPreview()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;[s.nodes[i],s.nodes[i-1]]=[s.nodes[i-1],s.nodes[i]];save();renderPreview()});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let i=+b.dataset.down;[s.nodes[i],s.nodes[i+1]]=[s.nodes[i+1],s.nodes[i]];save();renderPreview()});document.querySelectorAll('[data-select-img]').forEach(b=>b.onclick=()=>{let v=s.images[+b.dataset.selectImg];v.selected=!v.selected;save();renderPreview()});document.querySelectorAll('[data-remove-img]').forEach(b=>b.onclick=()=>{s.images.splice(+b.dataset.removeImg,1);save();renderPreview()});if($('editTopic'))$('editTopic').onclick=()=>ask('修改主题',s.topic,v=>setval('topic',v));if($('editClaim'))$('editClaim').onclick=()=>ask('编辑策展观点',s.claim,v=>setval('claim',v));if($('editSpace'))$('editSpace').onclick=()=>ask('编辑空间构想',s.space,v=>setval('space',v));if($('addNode'))$('addNode').onclick=()=>ask('添加展品或故事节点','',v=>{if(v)s.nodes.push(v);save();renderPreview()});if($('newImage'))$('newImage').onclick=()=>ask('描述想生成的展品/场景画面','',v=>{if(v)apply({kind:'image',value:v})});if($('rebuild'))$('rebuild').onclick=()=>{s.concept=true;save();renderPreview();toast('空间概念预览已更新')};if($('exportInline'))$('exportInline').onclick=download;if($('review'))$('review').onclick=()=>go(5)}
function visualCard(im,i){return `<div class="visualcard ${im.selected?'selected':''}"><div class="thumbnail">${imageSVG(im.title)}</div><div class="cap">${escapeHTML(im.title)}</div><button data-select-img="${i}">${im.selected?'✓ 已加入展馆':'加入展馆'}</button><button data-remove-img="${i}">删除</button></div>`}
function nodeList(edit){return s.nodes.length?s.nodes.map((x,i)=>`<div class="node"><span class="pill">${i+1}</span><b>${escapeHTML(x)}</b>${edit?`<button data-up="${i}" ${i===0?'disabled':''} title="上移">↑</button><button data-down="${i}" ${i===s.nodes.length-1?'disabled':''} title="下移">↓</button><button data-remove="${i}" title="删除">×</button>`:''}</div>`).join(''):'<div class="ghostline">暂无展品。在中间输入想法或添加节点。</div>'}
function sceneCard(){if(!s.space&&!s.concept)return `<div class="ghostline" style="min-height:145px;display:grid;place-items:center;text-align:center">暂未创建空间方案<br>先在中间描述展馆路线或空间氛围，右侧将更新概念预览。</div>`;let title=s.images.find(x=>x.selected)?.title||s.nodes[0]||'延安历史展厅';return `<div class="previewscene"><div class="scenehead"><strong>${escapeHTML(s.topic||'延安自然科学院 · 我的博物馆')}</strong><small>概念空间：${s.nodes.length}个节点 · ${s.images.filter(x=>x.selected).length}张视觉参考</small></div><div class="sceneart">${imageSVG('历史教室场景')}</div></div><div class="tip">场景布局示意 · 重点参考「${escapeHTML(title)}」。接入3D引擎后可替换为真实实时场景。</div>`}
function render(){let i=s.stage;let t=tasks[i];$('nav').innerHTML=names.map((n,j)=>`<button type="button" data-stage="${j}" class="step ${i===j?'active':''} ${j<i?'done':''}" aria-current="${i===j?'step':'false'}"><span class="num">${j<i?'✓':j+1}</span><span><b>${escapeHTML(n)}</b></span></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(+b.dataset.stage));$('stepno').textContent=`阶段 ${i+1} / 7`;$('question').textContent=t.q;$('mission').textContent=t.mission;$('goal').textContent=t.goal;$('chatTitle').textContent=names[i];$('chatHint').textContent=i===4?'你自由描述画面，AI 将其生成视觉素材草稿，右侧同步呈现。':'你主导内容与表达，AI 协助整理。建议由你确认后才会进入作品。';$('quick').innerHTML=t.quick.map((x,j)=>`<button data-quick="${j}">${escapeHTML(x)}</button>`).join('');document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{$('input').value=t.quick[+b.dataset.quick];$('input').focus()});$('prev').disabled=i===0;$('next').textContent=i===6?'完成并导出':'下一阶段 →';$('input').placeholder=i===4?'描述你想生成的画面，如：延安时期的窑洞教室，黑白历史插画……':'用自己的话告诉 AI 你的想法……';renderChat();renderPreview()};function go(i){s.stage=Math.max(0,Math.min(6,i));save();render()}function download(){let data={主题:s.topic,展品:s.nodes,观点:s.claim,视觉素材:s.images,空间设计:s.space,备注:'概念交互原型，图片/3D为占位预览'};let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='我的思政博物馆_策展方案.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('prev').onclick=()=>go(s.stage-1);$('next').onclick=()=>s.stage===6?download():go(s.stage+1);$('export').onclick=download;$('reset').onclick=()=>{if(confirm('清空本地草稿并重新开始？')){try{localStorage.removeItem(KEY)}catch(e){};s={stage:0,topic:'',claim:'',nodes:[],images:[],space:'',concept:false,chats:{}};render()}};render();
</script></body></html>
